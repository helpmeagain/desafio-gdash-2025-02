version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: dd_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: dd_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
      ollama serve &
      sleep 5 &&
      ollama pull llama3.1:8b &&
      wait
      "
    # ===== DESCOMENTAR SE TIVER GPU DA NVIDIA =====
    # runtime: nvidia
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    # environment:
    #   - OLLAMA_GPU_LAYER=1000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: api:latest
    container_name: api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGO_URL: "mongodb://mongo:27017/weather_data"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      JWT_SECRET: "your_secret"
      OLLAMA_URL: "http://ollama:11434/api/generate"
      OLLAMA_MODEL: "llama3.1:8b"
      ADMIN_EMAIL: "admin@email.com"
      ADMIN_PASSWORD: "admin123"
      SWAPI_URL: "https://swapi.dev/api/"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      - mongo
      - rabbitmq
      - ollama

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: web:latest
    container_name: web
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://api:3000
    ports:
      - "8080:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: worker:latest
    container_name: worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      QUEUE_NAME: "weather_data"
      API_URL: "http://api:3000/weather/logs"
      AUTH_URL: "http://api:3000/auth/login"
      ADMIN_EMAIL: "admin@email.com"
      ADMIN_PASSWORD: "admin123"
    depends_on:
      rabbitmq:
        condition: service_healthy
      api:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: apps/collector/Dockerfile
    image: collector:latest
    container_name: collector
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
  ollama_data:
