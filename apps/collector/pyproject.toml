[project]
name = "collector"
version = "0.1.0"
description = "Data collector service"
authors = [
    { name = "helpmeagain", email = "felipe.comarques1208@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "requests>=2.31",
    "httpx>=0.24",
    "pandas>=2.2",
    "pydantic>=2.5"
]

[tool.poetry]
packages = [
    { include = "main.py", from = "src" }
]

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
ruff = "^0.2.0"
black = "^24.3"
mypy = "^1.8"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
